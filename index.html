<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ওয়াইফাই ম্যান 3D — ফুরফুরি নগর</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Hind Siliguri', sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #090e1a; color: #f8fafc; touch-action: none; }
    #game-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }
    .fullscreen-overlay { position: fixed; inset: 0; background: radial-gradient(circle at top, #1e293b 0%, #090e1a 100%); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .auth-card { background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 18px; padding: 22px 26px; width: 100%; max-width: 440px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.7); }
    .auth-card h1 { font-size: 26px; color: #38bdf8; margin-bottom: 4px; }
    .auth-card p { font-size: 14px; color: #94a3b8; margin-bottom: 14px; }
    .auth-input { width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 15px; margin-bottom: 10px; outline: none; }
    .btn-main { width: 100%; padding: 12px; border: none; border-radius: 10px; background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
    #hud { position: fixed; inset: 0; z-index: 20; pointer-events: none; padding: 10px; }
    #top-bar { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; pointer-events: auto; }
    .hud-pill { display: flex; align-items: center; gap: 5px; background: rgba(15, 23, 42, 0.88); border: 1px solid rgba(148, 163, 184, 0.3); border-radius: 10px; padding: 6px 10px; color: #f8fafc; font-size: 13px; font-weight: 700; cursor: pointer; }
    .hud-pill.money { border-color: #f59e0b; color: #fde68a; }
    #yt-radio-container { position: fixed; bottom: 70px; right: 10px; width: 200px; height: 200px; border-radius: 12px; overflow: hidden; border: 1px solid rgba(56, 189, 248, 0.4); background: #000; z-index: 15; opacity: 0.15; pointer-events: auto; }
    #yt-radio-container:hover { opacity: 0.95; }
    #joystick-zone { position: absolute; bottom: 20px; left: 20px; width: 106px; height: 106px; border-radius: 50%; background: rgba(15, 23, 42, 0.55); border: 2px solid rgba(56, 189, 248, 0.45); pointer-events: auto; display: flex; align-items: center; justify-content: center; }
    #joystick-knob { width: 44px; height: 44px; border-radius: 50%; background: radial-gradient(circle, #38bdf8, #0284c7); }
    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(2, 6, 23, 0.8); z-index: 300; align-items: center; justify-content: center; padding: 14px; backdrop-filter: blur(4px); }
    .modal-backdrop.open { display: flex; }
    .modal-box { background: #0f172a; border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 16px; width: 100%; max-width: 480px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  </style>
</head>
<body>

  <canvas id="game-canvas"></canvas>

  <div id="yt-radio-container">
    <div id="yt-player"></div>
  </div>

  <div id="auth-screen" class="fullscreen-overlay">
    <div class="auth-card">
      <h1>📡 ওয়াইফাই ম্যান 3D</h1>
      <p>ফুরফুরি নগর ইন্টারনেট সার্ভিস প্রোভাইডার সিমুলেশন</p>
      <input type="text" id="reg-name" class="auth-input" placeholder="আপনার নাম লিখুন..." />
      <input type="text" id="reg-user" class="auth-input" placeholder="ইউজারনেম লিখুন..." />
      <button class="btn-main" onclick="startWorld()">অফিসে প্রবেশ করুন 🚀</button>
    </div>
  </div>

  <div id="hud" style="display:none;">
    <div id="top-bar">
      <button class="hud-pill money" id="money-pill">💰 টাকা: <span id="hud-money">৳৫০০</span></button>
      <button class="hud-pill" onclick="alert('খাতা ও কাস্টমার তালিকা')">📒 খাতা</button>
    </div>
    <div id="joystick-zone">
      <div id="joystick-knob"></div>
    </div>
  </div>

  <!-- Password Modal (Only opens on 5-tap for Admin) -->
  <div id="pass-modal" class="modal-backdrop">
    <div class="modal-box" style="max-width:340px;">
      <h3 style="color:#38bdf8;">🔐 ওনার ভেরিফিকেশন পাসওয়ার্ড</h3>
      <input type="password" id="owner-pass" class="auth-input" placeholder="পাসওয়ার্ড দিন (1234)..." />
      <button class="btn-main" onclick="verifyAdminPass()">প্রবেশ করুন</button>
    </div>
  </div>

<script>
  // Persistent Storage & Account Setup
  let currentUser = { name: "Player", money: 500 };
  let moneyTaps = 0;
  let tapTimer = null;

  document.getElementById('money-pill').addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    moneyTaps++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => { moneyTaps = 0; }, 2000);
    if (moneyTaps >= 5) {
      moneyTaps = 0;
      document.getElementById('pass-modal').classList.add('open');
    }
  });

  function verifyAdminPass() {
    const val = document.getElementById('owner-pass').value.trim();
    if (val === '1234') {
      document.getElementById('pass-modal').classList.remove('open');
      alert('👑 ওনার কন্ট্রোল প্যানেল সফলভাবে আনলক হয়েছে!');
    } else {
      alert('❌ ভুল পাসওয়ার্ড!');
    }
  }

  function startWorld() {
    const name = document.getElementById('reg-name').value.trim() || "তবিবুর আলম";
    currentUser.name = name;
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    initThreeWorld();
    initYouTubeMemeRadio();
  }

  // YouTube Auto-Play Meme Radio (7 Viral Memes Playlist)
  const memePlaylist = ['N8LNcRv8QWo', 'RXzuqEJLjpE', 'LEn2Hq-lnbQ', '3rGj-NUqAXs', 'GRhhpMuZ9Do', 'RVebXQMFnkE', 'OSSmnHMg2KM'];
  let ytPlayer = null;
  let currentMeme = 0;

  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  window.onYouTubeIframeAPIReady = function() {
    ytPlayer = new YT.Player('yt-player', {
      height: '200',
      width: '200',
      videoId: memePlaylist[0],
      playerVars: { autoplay: 1, mute: 1, controls: 0, playsinline: 1 },
      events: {
        onStateChange: (e) => {
          if (e.data === YT.PlayerState.ENDED) {
            currentMeme = (currentMeme + 1) % memePlaylist.length;
            ytPlayer.loadVideoById(memePlaylist[currentMeme]);
          }
        }
      }
    });
  };

  function initThreeWorld() {
    const canvas = document.getElementById('game-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 12);

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(10, 20, 10);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));

    // Ground
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.MeshLambertMaterial({ color: 0x3a6b2c })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // Player (White shirt & Blue pants look)
    const playerGrp = new THREE.Group();
    const torso = new THREE.Mesh(
      new THREE.BoxGeometry(0.9, 1.3, 0.5),
      new THREE.MeshLambertMaterial({ color: 0xf8fafc }) // White shirt
    );
    torso.position.y = 1.8;
    const pants = new THREE.Mesh(
      new THREE.BoxGeometry(0.8, 1.2, 0.4),
      new THREE.MeshLambertMaterial({ color: 0x1d4ed8 }) // Blue pants
    );
    pants.position.y = 0.8;
    playerGrp.add(torso, pants);
    scene.add(playerGrp);

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  }
</script>
</body>
</html>
